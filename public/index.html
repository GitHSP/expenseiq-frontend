<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <script src="%PUBLIC_URL%/theme-init.js"></script>
    <style>
      html.pre-dark, html.pre-dark body { background: #0a0a0a; }
      /* Loading screen, shown until the app replaces it */
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 10px; font-family: Inter, Arial, sans-serif; color: #111; }
      html.pre-dark .boot { color: #fff; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; animation: boot 1.4s ease-in-out infinite; }
      .boot b { font-size: 22px; letter-spacing: -0.3px; }
      .boot span { font-size: 12px; color: #9ca3af; letter-spacing: 0.4px; margin-top: -6px; }
      @keyframes boot { 50% { transform: scale(0.94); opacity: 0.8; } }
    </style>
    <meta
      name="description"
      content="Glacier — track spending, plan your monthly payments, and pay down debt the smart way."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Glacier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Glacier — Budget & Debt Planner</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="boot"><img src="%PUBLIC_URL%/logo192.png" alt="" /><b>Glacier</b><span>Money manager</span></div></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
